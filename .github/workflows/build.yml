# Compile le complément Outlook avec le compilateur C# fourni par Windows (.NET Framework 4),
# lance les tests, puis publie une release GitHub quand un tag "v*" est poussé
# ou quand le workflow est lancé à la main avec un numéro de version.

name: Construction et release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. v1.0.0) ; vide = simple construction"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  complement-outlook:
    name: Complément Outlook (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compiler, tester et créer l'installeur
        shell: pwsh
        working-directory: outlook-exe
        env:
          CI: "true"
          PG_VERSION: ${{ github.event.inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
          # Signature facultative : secrets SIGN_PFX_BASE64 (certificat de signature de code, en base 64) et SIGN_PASSWORD
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          PG_SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
        run: |
          if ($env:SIGN_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "signature.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
            $env:PG_SIGN_PFX = $pfx
            Write-Output "Signature Authenticode activée"
          }
          cmd /c construire.bat 2>&1 | Tee-Object -FilePath build-log.txt
          $rc = $LASTEXITCODE
          if ($rc -ne 0) {
            # erreurs de compilation et tests en échec visibles dans les annotations du job
            Select-String -Path build-log.txt -Pattern 'error CS|ECHEC|warning CS' | Select-Object -First 40 | ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
            exit $rc
          }

      - name: Préparer les fichiers de la release
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          $version = if ($env:RELEASE_VERSION) { $env:RELEASE_VERSION } elseif ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item outlook-exe/LISEZMOI.md outlook-exe/build/package/
          Compress-Archive -Path outlook-exe/build/package/* -DestinationPath "dist/PhishGuard-Outlook-$version.zip" -Force
          if (Test-Path outlook-exe/build/PhishGuard-Outlook.exe) {
            Copy-Item outlook-exe/build/PhishGuard-Outlook.exe "dist/PhishGuard-Outlook-$version-installeur.exe"
          }
          Get-ChildItem dist | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PhishGuard-Outlook
          path: dist/*

      # Attestation de provenance signée par GitHub : prouve que l'installeur a été construit ici, à partir de ce code.
      # Vérification : gh attestation verify PhishGuard-Outlook-vX.Y.Z-installeur.exe --repo Some0neElseIsHere/phishguard-outlook
      - name: Attester la provenance des fichiers publiés
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: PhishGuard pour Outlook ${{ github.event.inputs.version || github.ref_name }}
          body_path: docs/release-notes.md
          files: dist/*
