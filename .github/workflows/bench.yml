# Banc d'essai du moteur sur des corpus publics : vrais phishings (corpus de Jose Nazario, monkey.org)
# et vrais messages légitimes (SpamAssassin public corpus, listes de diffusion Apache).
# Les corpus sont téléchargés sur le runner et ne sont jamais ajoutés au dépôt ; seul le CSV des résultats
# (indices détectés par message) est déposé dans une release brouillon « bench » (non publique).

name: Banc d'essai

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bench:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compiler le banc d'essai
        shell: cmd
        working-directory: outlook-exe
        run: |
          set "CSC=%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          mkdir build 2>nul
          "%CSC%" /nologo /codepage:65001 /target:exe /out:build\Bench.exe /r:System.dll /r:System.Core.dll /r:Microsoft.CSharp.dll /r:System.Drawing.dll /r:System.Security.dll /r:System.IO.Compression.dll /r:System.Web.Extensions.dll src\Engine\*.cs /recurse:src\ThirdParty\*.cs tools\Bench.cs
          if errorlevel 1 exit /b 1

      - name: Télécharger les corpus
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force corpus | Out-Null
          Set-Location corpus
          foreach ($y in 2020..2025) { curl.exe -sSfL -o "phishing-$y.mbox" "https://monkey.org/~jose/phishing/phishing-$y" }
          foreach ($f in "20030228_easy_ham", "20030228_easy_ham_2", "20030228_hard_ham") {
            curl.exe -sSfL -o "$f.tar.bz2" "https://spamassassin.apache.org/old/publiccorpus/$f.tar.bz2"
            New-Item -ItemType Directory -Force $f | Out-Null
            tar -xjf "$f.tar.bz2" -C $f
          }
          # Listes Apache : développeurs, utilisateurs (souvent depuis Gmail ou Outlook.com) et annonces, sur quatre mois
          $lists = "dev@httpd.apache.org", "users@tomcat.apache.org", "dev@kafka.apache.org", "users@kafka.apache.org", "user@spark.apache.org",
                   "user@flink.apache.org", "users@maven.apache.org", "announce@apache.org", "general@incubator.apache.org", "users@solr.apache.org"
          foreach ($l in $lists) {
            foreach ($m in "2025-06", "2025-07", "2025-08", "2025-09") {
              $n = ($l -replace '[@.]', '-')
              curl.exe -sSL -o "apache-$n-$m.mbox" "https://lists.apache.org/api/mbox.lua?list=$l&date=$m"
            }
          }
          # Phishings récents capturés par des pièges à spam (adresses des victimes remplacées par phishing@pot)
          git clone -q --depth 1 https://github.com/rf-peixoto/phishing_pot.git phishing_pot
          # Spam reçu en 2026 (archive de Bruce Guenter, libre d'usage ; une seule récupération par jour)
          foreach ($m in "2026-06", "2026-07", "2026-08", "2026-09", "2026-10") {
            curl.exe -sSL -o "spam-$m.7z" "http://untroubled.org/spam/$m.7z"
            if ((Get-Item "spam-$m.7z").Length -gt 10000) { 7z x -y -bd -o"spam-2026\$m" "spam-$m.7z" | Out-Null }
          }
          "phishing_pot : " + (Get-ChildItem phishing_pot -Recurse -Filter *.eml).Count + " .eml ; spam 2026 : " + (Get-ChildItem spam-2026 -Recurse -File).Count + " messages"
          curl.exe -sSfL -o "secteur-public.csv" "https://raw.githubusercontent.com/etalab/noms-de-domaine-organismes-secteur-public/master/domains.csv"
          Get-ChildItem | Format-Table Name, Length

      - name: Analyser
        shell: pwsh
        run: |
          $a = @()
          foreach ($y in 2020..2025) { $a += "phish-$y=corpus\phishing-$y.mbox|monkey.org" }
          $a += "ham-easy=corpus\20030228_easy_ham", "ham-easy2=corpus\20030228_easy_ham_2", "ham-hard=corpus\20030228_hard_ham"
          foreach ($f in Get-ChildItem corpus\apache-*.mbox) { if ($f.Length -gt 1000) { $a += "ham-apache-$($f.BaseName.Substring(7))=$($f.FullName)" } }
          $a += "ham-cas-difficiles=outlook-exe\tests\legitimes|exemple-pme.fr"
          $a += "phish-pot=corpus\phishing_pot"
          if (Test-Path corpus\spam-2026) { $a += "spam-2026=corpus\spam-2026|untroubled.org|3000" }
          New-Item -ItemType Directory -Force out | Out-Null
          $env:PG_PUBLIC_SECTOR = (Resolve-Path corpus\secteur-public.csv).Path
          & outlook-exe\build\Bench.exe out\bench.csv @a
          $code = $LASTEXITCODE
          if ($code -ne 0) { Write-Output "::error::Bench.exe : code $code ; dernier message : $(Get-Content out\progress.txt -Raw -ErrorAction SilentlyContinue)" }
          Compress-Archive -Force out\bench.csv, out\progress.txt out\bench.zip
          if ($code -ne 0) { exit 1 }

      - name: Supprimer les brouillons précédents
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $drafts = gh api "repos/${{ github.repository }}/releases" --jq '.[] | select(.draft and (.tag_name | startswith("bench"))) | .id'
          foreach ($id in $drafts) { if ($id) { gh api -X DELETE "repos/${{ github.repository }}/releases/$id" } }

      - name: Déposer dans une release brouillon
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bench-${{ github.run_number }}
          name: Banc d'essai (brouillon)
          draft: true
          files: out/bench.zip
