# Sondage ponctuel des sources (liste du secteur public, preuves de propriétaire) ; supprimé après usage.
name: Sondage des sources
on:
  workflow_dispatch:
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preuves de propriétaire
        shell: bash {0}
        run: |
          sudo apt-get install -y -qq dnsutils >/dev/null 2>&1 || true
          python3 .github/sonde.py bnpparibas.eu:bnpparibas.com bnpparibas.fr:bnpparibas.com credit-agricole.com:credit-agricole.fr caisse-epargne.com:caisse-epargne.fr labanquepostale.com:labanquepostale.fr boursorama.fr:boursorama.com engie.com:engie.fr totalenergies.com:totalenergies.fr leroymerlin.com:leroymerlin.fr carrefour.com:carrefour.fr airfrance.com:airfrance.fr orange.eu:orange.fr microsoft.eu:microsoft.com credit-agricole.eu:credit-agricole.fr lcl.eu:lcl.fr amazon.eu:amazon.com paypal.eu:paypal.com laposte.eu:laposte.fr edf.eu:edf.fr axa.eu:axa.com sncf-connect.eu:sncf-connect.com hsbc.eu:hsbc.com
