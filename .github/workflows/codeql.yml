# Analyse de code automatique (CodeQL) : injections, expressions régulières dangereuses, données mal échappées…
# Les résultats apparaissent dans l'onglet Security → Code scanning.
name: CodeQL

on:
  push:
    branches: [main]
    paths: ["outlook-exe/src/**", "outlook-exe/installer/**", ".github/workflows/codeql.yml"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyse du code C#
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
