<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>PhishGuard</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css">
  <script type="module" src="taskpane.js"></script>
</head>
<body>
  <main id="app">
    <section id="state-loading" class="state">
      <div class="spinner" aria-hidden="true"></div>
      <p>Analyse du message…</p>
    </section>

    <section id="state-empty" class="state" hidden>
      <p>Sélectionnez un message pour l’analyser.</p>
    </section>

    <section id="state-error" class="state" hidden>
      <p class="error-title">L’analyse n’a pas pu aboutir.</p>
      <p id="error-text" class="muted"></p>
      <button type="button" class="btn" data-action="retry">Réessayer</button>
    </section>

    <section id="state-result" hidden>
      <header id="verdict" class="verdict">
        <div class="score" aria-hidden="true">
          <svg viewBox="0 0 36 36"><circle class="track" cx="18" cy="18" r="15.5"/><circle id="score-arc" class="arc" cx="18" cy="18" r="15.5"/></svg>
          <span id="score-value">0</span>
        </div>
        <div class="verdict-text">
          <p class="eyebrow">Risque de phishing</p>
          <h1 id="verdict-label">—</h1>
          <p id="verdict-advice"></p>
        </div>
      </header>

      <div class="actions">
        <button type="button" class="btn btn-primary" data-action="report" id="btn-report">Signaler à la sécurité</button>
        <button type="button" class="btn" data-action="copy">Copier le rapport</button>
        <button type="button" class="btn btn-ghost" data-action="trust" id="btn-trust" hidden>Faire confiance à ce domaine</button>
      </div>
      <p id="toast" class="toast" role="status" hidden></p>

      <div id="sender-card" class="card sender"></div>

      <div id="findings"></div>

      <details id="positives-block" class="card" hidden>
        <summary>Points rassurants</summary>
        <ul id="positives"></ul>
      </details>

      <details id="links-block" class="card" hidden>
        <summary id="links-summary">Domaines des liens</summary>
        <ul id="link-domains" class="mono-list"></ul>
      </details>

      <details id="info-block" class="card" hidden>
        <summary>Détails techniques</summary>
        <ul id="info-list"></ul>
      </details>

      <details id="trusted-block" class="card" hidden>
        <summary>Mes domaines de confiance</summary>
        <ul id="trusted-list" class="mono-list"></ul>
      </details>

      <footer class="foot muted">
        Analyse locale : le contenu du message ne quitte pas votre poste.<br>
        <span id="lists-status"></span>
      </footer>
    </section>
  </main>
</body>
</html>
