# =============================================================================
#  PhishGuard - configuration de l'entreprise
#  À adapter AVANT de lancer construire.bat : ce fichier est intégré à l'installeur.
#  Listes : valeurs séparées par des virgules.
# =============================================================================

# Nom de l'entreprise (repéré dans le nom affiché des expéditeurs externes)
CompanyName =

# Domaines de l'entreprise, ex. : mon-entreprise.fr, mon-entreprise.com
# Un domaine qui les imite est classé critique. Vide = domaine de l'adresse Outlook de l'utilisateur.
CompanyDomains =

# Entreprises surveillées (groupe, filiales, y compris à l'étranger) : Nom | Pays | Identifiant | Dirigeant; Dirigeant
# Leurs noms et leurs dirigeants servent à détecter l'usurpation et la fraude au président. Exemple :
# Company1 = Mon Entreprise SAS | FR | 552100554 | Prénom Nom; Prénom Nom
# Company2 = Ma Filiale GmbH | Allemagne |  | Vorname Name

# Ancien format (une seule entreprise) : dirigeants, ex. Prénom Nom, Prénom Nom
VipNames =

# Domaines de partenaires de confiance, jamais signalés comme sosies
TrustedDomains =

# Adresse de l'équipe sécurité pour le bouton « Signaler » de la fenêtre d'analyse
# (vide = PhishGuard propose de la saisir au premier signalement)
ReportAddress =

# Analyse automatique : le score s'affiche dans le ruban dès qu'un message est sélectionné ou ouvert
AutoAnalyze = true

# Alerte en bas à droite de l'écran : dangerous (messages dangereux), suspicious (suspects et dangereux), none
AlertLevel = dangerous

# Empreintes des pièces jointes calculées automatiquement jusqu'à cette taille (Mo) ; au-delà, à l'ouverture du détail
AutoHashMaxMB = 5

# Explications pédagogiques sous chaque indice (false pour les utilisateurs expérimentés)
ShowExplanations = true

# Premier contact et sosies de vos correspondants (à partir des éléments envoyés et des contacts, sur le poste)
KnownCorrespondents = true

# Âge des domaines via RDAP (gratuit, sans clé ; seul le nom de domaine est envoyé)
DomainAgeLookup = true

# Catégorie de couleur « PhishGuard : Dangereux / Suspect » dans la boîte de réception
TagCategory = false

# Après « Signaler », déplacer le message dans Courrier indésirable
MoveAfterReport = true

# Journal des scores (%LOCALAPPDATA%\PhishGuard\scores.csv) : date, verdict, score, domaine, indices
ScoreLog = true

# Expéditeurs de confiance (adresses), en plus des domaines de confiance
TrustedSenders =

# Liste de blocage partagée par l'équipe sécurité (un domaine par ligne), ex. \\serveur\securite\phishguard.txt
SharedBlocklistPath =

# Bouton « Paramètres » dans Outlook : true = chaque utilisateur peut modifier ses réglages
# (enregistrés dans %LOCALAPPDATA%\PhishGuard\config.user.ini) ; false = configuration imposée par ce fichier
AllowUserSettings = true

# Liste Red Flag Domains (téléchargée une fois par jour au démarrage d'Outlook)
# Licence CC BY-NC-SA 4.0 : vérifiez que votre usage est couvert (hello@red.flag.domains)
RedFlagEnabled = true
RedFlagUrl = https://dl.red.flag.domains/red.flag.domains.txt
RedFlagMaxAgeHours = 24

# Langue de l'interface : auto (langue de Windows), fr ou en
Language = auto

# Fenêtre d'analyse : false = mode simple (verdict en clair et « Que dois-je faire ? », recommandé),
# true = mode expert (analyse technique détaillée et réglages avancés). Chaque utilisateur peut changer.
ExpertMode = false

# Surveillance hebdomadaire des nouveaux domaines sosies de vos domaines (requêtes DNS uniquement).
WatchDomains = true

# -----------------------------------------------------------------------------
#  Réputation : sources externes optionnelles (onglet Réputation des paramètres)
#  Elles ne reçoivent jamais le contenu des messages : domaines, empreintes ou IP.
# -----------------------------------------------------------------------------
# Domaines du secteur public (liste ouverte de la DINUM, Licence Ouverte 2.0, téléchargée chaque mois) :
# un message authentifié d'un organisme public n'est pas pris pour un faux. Les .gouv.fr sont reconnus sans la liste.
PublicSectorList = true
# Listes sans clé, comparées sur le poste : OpenPhish (pages de phishing actives), Tranco (sites très fréquentés)
BetaOpenPhish = false
BetaTranco = false
# DNS de l'expéditeur (existence, MX, SPF, DMARC, BIMI ; un domaine qui ressemble à une marque mais géré par
# les serveurs DNS de celle-ci est reconnu comme le sien) et âge du premier certificat HTTPS (crt.sh)
BetaDnsChecks = false
BetaCertAge = false
# Clés par défaut pour tous (laisser vide : chaque utilisateur saisit la sienne, rangée dans le
# Gestionnaire d'identification de Windows). Attention : une clé écrite ici est lisible en clair.
VirusTotalKey =
AbuseChKey =
AbuseIpdbKey =
